name: 🤖 Assign PR & Set Reviewers

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  assign_and_request_reviews:
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 Define author and reviewers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_AUTHOR="${{ github.event.pull_request.user.login }}"
          COLLABORATORS=("Lascar-png" "SaiKido33" "Skyniraph" "Kgeek33")

          REVIEWERS=()
          for user in "${COLLABORATORS[@]}"; do
            if [[ "$user" != "$PR_AUTHOR" ]]; then
              REVIEWERS+=("$user")
            fi
          done

          REVIEWERS_JSON=$(printf '%s\n' "${REVIEWERS[@]}" | jq -R . | jq -s .)

          echo "Auteur de la PR : $PR_AUTHOR"
          echo "Reviewers assignés : ${REVIEWERS[@]}"

          gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }} \
            -X PATCH -f assignees=[$PR_AUTHOR]

          gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/requested_reviewers \
            -X POST -f reviewers=$REVIEWERS_JSON
