name: 👀 Auto Request Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  auto-request-review:
    runs-on: ubuntu-latest
    steps:
      - name: 🙋 Define author
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_AUTHOR="${{ github.event.pull_request.user.login }}"
          gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }} \
            -X PATCH -f assignees[]="$PR_AUTHOR"

      - name: 🔄 Request review based on files changes
        uses: necojackarc/auto-request-review@v0.13.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config: .github/reviewers.yml
          use_local: false

      - name: 🔁 Re-request review for changes requested
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"
          CHANGES_REQUESTED_REVIEWERS=$(gh api repos/$REPO/pulls/$PR_NUMBER/reviews --jq '[group_by(.user.login)[] | max_by(.submitted_at) | select(.state=="CHANGES_REQUESTED") | .user.login] | unique')

          for reviewer in $CHANGES_REQUESTED_REVIEWERS; do
            echo "Re-requesting review from $reviewer"
            gh api repos/$REPO/pulls/$PR_NUMBER/requested_reviewers \
              -X POST -f reviewers[]="$reviewer"
          done

      - name: ▶️ Launch workflow Auto Merge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token $GITHUB_TOKEN" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/merge_pr.yml/dispatches \
            -d '{"ref":"main", "inputs":{"pr_number":"${{ github.event.pull_request.number }}"}}'
