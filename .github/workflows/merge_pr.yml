name: 🤖 Auto Merge PR

on:
  pull_request_review:
    types: [submitted, edited]

jobs:
  auto-merge:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v2

    - name: ✏ Get PR details
      id: pr
      uses: actions/github-script@v3
      with:
        script: |
          const pr = await github.pulls.get({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: context.issue.number
          });
          return pr.data;

    - name: ✏ Get PR reviews
      id: get-reviews
      run: |
        curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/${{ github.repository }}/pulls/${{ github.event.number }}/reviews > reviews.json
        cat reviews.json

    - name: 👀 Check PR reviews
      id: check-reviews
      run: |
        PR_REVIEWS=$(cat reviews.json)
        APPROVED=$(echo "$PR_REVIEWS" | jq -r 'map(select(.state == "APPROVED")) | length')
        REQUEST_CHANGES=$(echo "$PR_REVIEWS" | jq -r 'map(select(.state == "CHANGES_REQUESTED")) | length')
        echo "approved=$APPROVED" >> $GITHUB_ENV
        echo "changes_requested=$REQUEST_CHANGES" >> $GITHUB_ENV

    - name: ✔ Enable Auto Merge
      if: ${{ env.approved == 0 && env.changes_requested == 0 }}
      uses: peter-evans/enable-pull-request-automerge@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        pull-request-number: ${{ github.event.number }}
        merge-method: merge
