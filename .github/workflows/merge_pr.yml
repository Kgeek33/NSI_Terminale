name: 🤖 Auto-merge PR if all assigned reviewers approve

on:
  pull_request_review:
    types: [submitted, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Numéro de la pull request"
        required: true
        default: ""

jobs:
  automerge:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check if all assigned reviewers approved
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=${{ github.event.pull_request.number || github.event.inputs.pr_number }}
          REPO=${{ github.repository }}

          ASSIGNED_REVIEWERS=$(gh api repos/$REPO/pulls/$PR_NUMBER/requested_reviewers --jq '.users[].login')

          ASSIGNED_REVIEWERS_LIST=()

          for reviewer in $ASSIGNED_REVIEWERS; do
            ASSIGNED_REVIEWERS_LIST+=("$reviewer")
          done

          APPROVED_REVIEWERS=$(gh api repos/$REPO/pulls/$PR_NUMBER/reviews --jq '[group_by(.user.login)[] | max_by(.submitted_at) | select(.state=="APPROVED") | .user.login] | unique')

          CHANGES_REQUESTED_REVIEWERS=$(gh api repos/$REPO/pulls/$PR_NUMBER/reviews --jq '[group_by(.user.login)[] | max_by(.submitted_at) | select(.state=="CHANGES_REQUESTED") | .user.login] | unique')

          echo "Reviewers assignés: ${ASSIGNED_REVIEWERS_LIST[@]}"
          echo "Reviewers ayant approuvé: $APPROVED_REVIEWERS"
          echo "Reviewers ayant demandé des changements: $CHANGES_REQUESTED_REVIEWERS"

          ALL_APPROVED=true
          for reviewer in "${ASSIGNED_REVIEWERS_LIST[@]}"; do
            if ! echo "$APPROVED_REVIEWERS" | grep -q "$reviewer"; then
              ALL_APPROVED=false
              break
            fi
          done

          if [ "$ALL_APPROVED" = true ] && [ "$CHANGES_REQUESTED_REVIEWERS" = [] ]; then
            echo "✅ Tous les reviewers ont approuvé"
            gh pr merge $PR_NUMBER --merge --repo $REPO

            curl -X POST \
              -H "Accept: application/vnd.github.v3+json" \
              -H "Authorization: token $GITHUB_TOKEN" \
              https://api.github.com/repos/$REPO/actions/workflows/update_branches.yml/dispatches \
              -d '{"ref":"main"}'
          else
            echo "❌ Tous les reviewers n'ont pas encore approuvé/n'ont pas encore fait une review"
          fi
