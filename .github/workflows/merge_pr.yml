name: 🤖 Auto-merge PR if all assigned reviewers approve

on:
  pull_request_review:
    types: [submitted]

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check if all assigned reviewers approved
        id: check_approval
        run: |
          APPROVALS=$(jq '.pull_request.reviewers | map(select(.state == "APPROVED")) | length' "$GITHUB_EVENT_PATH")
          TOTAL_REVIEWERS=$(jq '.pull_request.reviewers | length' "$GITHUB_EVENT_PATH")
          if [ "$APPROVALS" -eq "$TOTAL_REVIEWERS" ]; then
            echo "approved=true" >> $GITHUB_ENV
          else
            echo "approved=false" >> $GITHUB_ENV
          fi

      - name: ✅ Merge PR
        if: env.approved == 'true'
        run: |
          gh pr merge ${{ github.event.pull_request.number }} --merge
