name: 🤖 Auto-merge PR if all assigned reviewers approve

on:
  pull_request_review:
    types: [submitted, edited]

jobs:
  automerge:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check if all assigned reviewers approved
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          REPO=${{ github.repository }}

          echo "Fetching assigned reviewers..."
          ASSIGNED_REVIEWERS=$(gh api repos/$REPO/pulls/$PR_NUMBER/requested_reviewers --jq '.users[].login' | tr '\n' ' ')
          IFS=' ' read -r -a ASSIGNED_REVIEWERS_ARRAY <<< "$ASSIGNED_REVIEWERS"
          echo "Reviewers assignés: ${ASSIGNED_REVIEWERS_ARRAY[@]}"

          echo "Fetching approved reviewers..."
          APPROVED_REVIEWERS=$(gh api repos/$REPO/pulls/$PR_NUMBER/reviews --jq '[.[] | select(.state=="APPROVED") | .user.login] | unique' | tr '\n' ' ')
          IFS=' ' read -r -a APPROVED_REVIEWERS_ARRAY <<< "$APPROVED_REVIEWERS"
          echo "Reviewers ayant approuvé: ${APPROVED_REVIEWERS_ARRAY[@]}"

          echo "Fetching reviewers who requested changes..."
          CHANGES_REQUESTED_REVIEWERS=$(gh api repos/$REPO/pulls/$PR_NUMBER/reviews --jq '[.[] | select(.state=="CHANGES_REQUESTED") | .user.login] | unique' | tr '\n' ' ')
          IFS=' ' read -r -a CHANGES_REQUESTED_REVIEWERS_ARRAY <<< "$CHANGES_REQUESTED_REVIEWERS"
          echo "Reviewers ayant demandé des changements: ${CHANGES_REQUESTED_REVIEWERS_ARRAY[@]}"

          if [ ${#CHANGES_REQUESTED_REVIEWERS_ARRAY[@]} -eq 0 ]; then
            ALL_APPROVED=true
            for reviewer in "${ASSIGNED_REVIEWERS_ARRAY[@]}"; do
              if [[ ! " ${APPROVED_REVIEWERS_ARRAY[@]} " =~ " ${reviewer} " ]]; then
                ALL_APPROVED=false
                break
              fi
            done

            if [ "$ALL_APPROVED" = true ]; then
              echo "✅ Tous les reviewers ont approuvé, on merge la PR..."
              gh pr merge $PR_NUMBER --merge --repo $REPO

              curl -X POST \
                -H "Accept: application/vnd.github.v3+json" \
                -H "Authorization: token $GITHUB_TOKEN" \
                https://api.github.com/repos/$REPO/actions/workflows/update_branches.yml/dispatches \
                -d '{"ref":"main"}'
            else
              echo "❌ Tous les reviewers n'ont pas encore approuvé ou des changements ont été demandés, on attend."
            fi
          else
            echo "❌ Tous les reviewers n'ont pas encore approuvé ou des changements ont été demandés, on attend."
          fi
