name: Checks (Flake8)

on:
  pull_request:
    branches: [ "main" ] 

jobs:
  lint:
    name: 🛠️ Flake8 on Pull Request
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v2

      - name: ⚙️ Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: "3.13"

      - name: ⚙️ Set up Flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: 🔍 Identify modified Python files
        id: get_modified_files
        run: |
          echo "Modified files:"
          git fetch origin
          git diff --name-status main...origin/${{ github.head_ref }} | grep '\.py$' > modified_files.txt
          cat modified_files.txt
          echo "files=$(< modified_files.txt)" >> $GITHUB_ENV

      - name: 🔍 Run Flake8 checks
        run: |
          if [ -s modified_files.txt ]; then
            flake8 $(< modified_files.txt) --max-line-length=88 > flake8_errors.log || true
          else
            echo "Aucun fichier Python modifié."
            echo "is_empty=true" >> $GITHUB_ENV
            exit 0
          fi

      - name: 📋 Check if lint logs are empty
        id: check_logs
        run: |
          if [ -s flake8_errors.log ]; then
            echo "is_empty=false" >> $GITHUB_ENV
          else
            echo "is_empty=true" >> $GITHUB_ENV
          fi

      - name: 📄 Output Logs
        run: cat flake8_errors.log

      - name: 👁️‍🗨️ Comment on Pull Request
        if: env.is_empty == 'false'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const lintLogContent = fs.readFileSync('flake8_errors.log', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `⚠️ Erreur(s) détectée(s) par Flake8 !\n\`\`\`\n${lintLogContent}\n\`\`\``
            });

      - name: 🧹 Clean up
        if: always()
        run: rm -f flake8_errors.log modified_files.txt
