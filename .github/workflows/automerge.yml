name: 🤖 Auto-merge PR if 4 approvals

on:
  pull_request_review:
    types: [submitted, edited]

jobs:
  automerge:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check reviews
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APPROVALS=$(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews \
            --jq '[.[] | select(.state=="APPROVED")] | length')

          echo "Nombre d'approbations: $APPROVALS"

          if [ "$APPROVALS" -ge 4 ]; then
            echo "Merging PR..."
            gh pr merge ${{ github.event.pull_request.number }} --merge --repo ${{ github.repository }}
          else
            echo "Pas assez d'approbations pour merger."
          fi
