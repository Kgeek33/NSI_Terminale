name: 🔄️ Update Branches

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  update-branches:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: 🔧 Configure Git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: 🔄 Update all branches
        run: |
          git fetch origin
          branches=$(git branch -r | grep -v '\->' | grep -v 'main' | sed 's/origin\///')
          for branch in $branches; do
            git checkout $branch
            if git merge origin/main --no-edit -m "[bot] Merge origin/main => $branch"; then
              git push origin $branch
            else
              echo "Conflit détecté lors de la fusion de main dans $branch"
              git merge --abort
            fi
          done
