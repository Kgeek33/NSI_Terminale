name: 🐍 Python Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  python-review:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4.2.2

      - name: ⚙️ Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.13"

      - name: 📥 Install Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: "21"

      - name: 📥 Install Pyright and Flake8
        run: |
          npm install -g pyright
          pip install flake8

      - name: ▶️ Check modified Python files
        id: check_python
        run: |
          git fetch origin main
          git diff --name-only origin/main | grep "\.py" > modified_files.txt || true
          files=$(cat modified_files.txt)

          if [ -z "$files" ]; then
            echo "No Python files modified."
            echo "pyright_passed=null" >> $GITHUB_ENV
            echo "flake8_passed=null" >> $GITHUB_ENV
          else
            pyright_passed=true
            > pyright_output.txt
            flake8_passed=true
            > flake8_output.txt
            while IFS= read -r file; do
              if [ -f "$file" ]; then
                echo "Checking $file"
                pyright "$file" >> pyright_output.txt || pyright_passed=false
                flake8 "$file" >> flake8_output.txt || flake8_passed=false
              else
                echo "File $file does not exist, skipping."
              fi
            done < modified_files.txt

            if [ "$pyright_passed" = true ]; then
              echo "pyright_passed=true" >> $GITHUB_ENV
            else
              echo "pyright_passed=false" >> $GITHUB_ENV
            fi

            if [ "$flake8_passed" = true ]; then
              echo "flake8_passed=true" >> $GITHUB_ENV
            else
              echo "flake8_passed=false" >> $GITHUB_ENV
            fi
          fi

      - name: ✅ Approve PR if Flake8 passes
        if: env.pyright_passed == 'true' && env.flake8_passed == 'true'
        uses: actions/github-script@v7.0.1
        with:
          script: |
            github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              event: "APPROVE",
              body: "Pyright et Flake8 sont contents, LGTM 👍"
            });

            github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "merge_pr.yml",
              ref: "main",
              inputs: {
                pr_number: context.payload.pull_request.number.toString()
              }
            });

      - name: ❌ Request changes with comments if checks failed
        if: env.pyright_passed == 'false' || env.flake8_passed == 'false'
        uses: actions/github-script@v7.0.1
        with:
          script: |
            const fs = require("fs");

            const pyrightOutput = fs.existsSync("pyright_output.txt")
              ? fs.readFileSync("pyright_output.txt", "utf8")
              : "";
            const flake8Output = fs.existsSync("flake8_output.txt")
              ? fs.readFileSync("flake8_output.txt", "utf8")
              : "";

            const statusTable = `
              | Source   | Statut |
              |----------|--------|
              | Pyright  | ${process.env.pyright_passed === 'true' ? '✅' : '❌'} |
              | Flake8   | ${process.env.flake8_passed === 'true' ? '✅' : '❌'} |
            `.trim();

            const comments = [];

            flake8Output.split("\n").forEach((line) => {
              const match = line.match(/^(.*?):(\d+):(\d+): (.*)$/);
              if (match) {
                const [_, path, lineNum, column, message] = match;
                comments.push({
                  path,
                  line: parseInt(lineNum, 10),
                  body: `🧪 **Flake8** – Col ${column} ➡️ ${message}`
                });
              }
            });

            pyrightOutput.split("\n").forEach((line) => {
              const match = line.match(/^(.*?):(\d+):(\d+)\s+-\s+\w+:\s+(.*)$/);
              if (match) {
                const [_, rawPath, lineNum, column, message] = match;
                const path = rawPath.trim();
                comments.push({
                  path,
                  line: parseInt(lineNum, 10),
                  body: `🧠 **Pyright** – Col ${column} ➡️ ${message}`
                });
              }
            });

            github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              event: "REQUEST_CHANGES",
              body: `Aïe, un ou plusieurs checks ont échoué 👇\n\n${statusTable}`,
              comments
            });
