name: 🛠️ Update Contributors in README

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  update-contributors:
    runs-on: ubuntu-latest

    steps:
      - name: 🛠️ Checkout repository
        uses: actions/checkout@v4.2.2

      - name: 📥 Fetch contributors from GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          contributors=$(gh api repos/${{ github.repository }}/contributors --paginate)

          table="## Contributions des Contributeurs\n\n| Contributeur | Contributions |\n|--------------|---------------|\n"
          for row in $(echo "$contributors" | jq -c '.[]'); do
            login=$(echo "$row" | jq -r '.login')
            contributions=$(echo "$row" | jq -r '.contributions')
            table+="| @$login | $contributions |\n"
          done

          echo -e "$table" > CONTRIBUTORS.md

      - name: 📝 Update README.md
        run: |
          sed -i '/## Contributions des Contributeurs/,$d' README.md
          cat CONTRIBUTORS.md >> README.md

      - name: 📤 Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add README.md
          git commit -m "🔄 Mise à jour des contributions des contributeurs"
          git push

      - name: 🚀 Update branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/update_branches.yml/dispatches \
            -d '{"ref":"main"}'
