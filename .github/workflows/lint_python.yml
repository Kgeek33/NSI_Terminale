name: 🛠️ Check Python Lint via Flake8

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  flake8-lint:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: ⚙️ Set up Flake8
        run: |
          pip install flake8-simplify flake8-unused-arguments flake8-quotes

      - name: 🔍 Run Flake8 checks
        run: |
          flake8 . --output-file=flake8_output.txt || true

      - name: 📋 Report Flake8 results with reviewdog
        uses: reviewdog/action-flake8@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          filter_mode: file
