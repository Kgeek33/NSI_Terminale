name: 📝 Auto Tag on PR via Labeler

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  labeler:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4.2.2

      - name: 🙋 Define author
        env:
          GITHUB_TOKEN: ${{ secrets.ADMIN_PAT }}
        run: |
          PR_AUTHOR="${{ github.event.pull_request.user.login }}"
          gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }} \
            -X PATCH -f assignees[]="$PR_AUTHOR"

      - name: 🚀 Enable automerge
        env:
          GITHUB_TOKEN: ${{ secrets.ADMIN_PAT }}
        run: |
          gh pr merge ${{ github.event.pull_request.number }} --auto --merge --repo ${{ github.repository }}

      - name: 🏷️ Add labels to PR
        uses: actions/labeler@v5.0.0
        with:
          repo-token: ${{ secrets.ADMIN_PAT }}
          configuration-path: .github/labeler.yml
